---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xyproblem-dep
spec:
  selector:
    matchLabels:
      app: xyproblem
  replicas: 1
  template:
    metadata:
      labels:
        app: xyproblem
    spec:
      automountServiceAccountToken: false
      securityContext:
      #   runAsGroup: 1000
      #   runAsUser: 1000
        fsGroup : 1000
      #   runAsNonRoot: true
      initContainers:
      - name: pull-source
        image: alpine:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsUser: 1000
          runAsNonRoot: true
          capabilities:
            drop: [ALL]
        command:
        - sh
        - -c
        - |
          cd /source
          wget https://github.com/Alestrix/xyproblem.de/archive/refs/heads/master.zip
          unzip master.zip
          mv xyproblem.de-master/* .
          #sed -i 's/lux/material/g' /source/mkdocs.yml
          ls -al
        volumeMounts:
        - name: source
          mountPath: /source
      - name: build-site
        image: titom73/mkdocs:latest #ghcr.io/peaceiris/mkdocs-material:v4.0.1
        securityContext:
          runAsGroup: 0
          runAsUser: 0
          runAsNonRoot: false
          capabilities:
            drop: [ALL]
        args:
        - build
        - -d
        - /site
        # - sh
        # - -c
        # - |
        #   pip install mkdocs-bootswatch
        #   mkdocs build -d /site -f /docs/mkdocs.yml
        volumeMounts:
        - name: source
          mountPath: /docs
        - name: site
          mountPath: /site
      containers:
      - name: xyproblem-web
        image: joseluisq/static-web-server:2
        securityContext:
          runAsGroup: 1000
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: SERVER_LOG_FORWARDED_FOR
          value: 'true'
        - name: SERVER_LOG_REMOTE_ADDRESS
          value: 'true'
        - name: SERVER_CORS_ALLOW_ORIGINS
          value: ""
        - name: SERVER_LOG_LEVEL
          value: info
        - name: SERVER_HEALTH
          value: 'true'
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          failureThreshold: 1
          initialDelaySeconds: 10
          periodSeconds: 10
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: site
          mountPath: /public
        resources:
          limits:
            cpu: "1000m"
            memory: "256M"
          requests:
            cpu: "10m"
            memory: "32M"
      volumes:
      - name: source
        emptyDir:
          medium: Memory
      - name: site
        emptyDir:
          medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: xyproblem-svc
spec:
  selector:
    app: xyproblem
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
